<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Message Capture System</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .connection-status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      padding: 8px 12px;
      background-color: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #6c757d;
    }
    
    .status-indicator.connecting {
      background-color: #ffc107;
      animation: pulse 1.5s infinite;
    }
    
    .status-indicator.connected {
      background-color: #28a745;
    }
    
    .status-indicator.error {
      background-color: #dc3545;
    }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    
    #connection-text {
      font-size: 14px;
      color: #495057;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WhatsApp Message Capture System</h1>
      <p>Monitor and view messages from WhatsApp groups</p>
      <div class="connection-status-bar">
        <div class="status-indicator" id="connection-indicator"></div>
        <span id="connection-text">Checking connection...</span>
      </div>
      <nav>
        <a href="/">Table View</a> | 
        <a href="/dashboard.html" class="active">Dashboard View</a> | 
        <a href="/qr">QR Code</a>
      </nav>
    </header>

    <div class="main-content">
      <div class="groups-panel">
        <h2>Groups</h2>
        <div class="search-box">
          <input type="text" id="group-search" placeholder="Search groups...">
        </div>
        <ul id="groups-list" class="groups-list">
          <!-- Groups will be populated here -->
          <li class="loading">Loading groups...</li>
        </ul>
      </div>

      <div class="messages-panel">
        <div class="messages-header">
          <h2 id="current-group">Select a group</h2>
          <span id="message-count" class="message-count">0 messages</span>
        </div>
        <div id="messages-container" class="messages-container">
          <!-- Messages will be populated here -->
          <div class="no-messages">Select a group to view messages</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message template -->
  <template id="message-template">
    <div class="message">
      <div class="message-header">
        <span class="sender-name"></span>
        <span class="timestamp"></span>
      </div>
      <div class="message-body"></div>
      <!-- Attachments will be added here dynamically -->
    </div>
  </template>

  <!-- Group template -->
  <template id="group-template">
    <li class="group-item">
      <div class="group-name"></div>
      <div class="group-info">
        <span class="message-count"></span>
        <span class="last-message-time"></span>
      </div>
    </li>
  </template>

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Main JavaScript -->
  <script src="/js/main.js"></script>
</body>
</html>
